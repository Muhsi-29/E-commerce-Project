# Runs on every push and pull request: the storefront is linted, typechecked and built.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  storefront:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: paths like /products/3 don't exist as files, so serve index.html and let React Router handle them
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built files have a content hash in their name, so browsers can cache them for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
